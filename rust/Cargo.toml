[package]
name = "cln-zapit-policy"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
description = "Defensive incoming-channel admission policy for Core Lightning"

[dependencies]
anyhow = "1.0"
cln-plugin = "0.7.0"
cln-rpc = "0.7.0"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
pretty_assertions = "1.4"

[profile.release]
lto = "thin"
strip = "debuginfo"
